name: macOS Installation Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-macos:
    runs-on: macos-latest
    env:
      CI: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Grant execution permissions
        run: chmod +x install.sh install bin/* modules/*/install.sh lib/*.sh

      - name: Run Dotfiles Installer
        run: |
          echo "🚀 Running ./install.sh..."
          ./install.sh

      - name: Run Environment Diagnostics
        run: |
          echo "--- Running bin/doctor ---"
          ./bin/doctor

      - name: Verify Configurations (Zero Symlinks)
        run: |
          echo "--- Verifying .zshrc ---"
          grep -q "Dotfiles loader" "$HOME/.zshrc" && echo "✅ .zshrc loader configured" || exit 1

          echo "--- Verifying Git Include ---"
          git config --global --get include.path | grep -q "config/git/.gitconfig" && echo "✅ git include.path OK" || exit 1
          git config --global --get core.excludesfile | grep -q "config/git/.gitignore_global" && echo "✅ git core.excludesfile OK" || exit 1

          echo "--- Verifying CLI Tools ---"
          command -v eza && echo "✅ eza OK"
          command -v bat && echo "✅ bat OK"
          command -v rg && echo "✅ ripgrep OK"
          command -v fd && echo "✅ fd OK"
          command -v sd && echo "✅ sd OK"
          command -v fzf && echo "✅ fzf OK"
          command -v fnm && echo "✅ fnm OK"
          command -v gh && echo "✅ gh OK"
          command -v delta && echo "✅ delta OK"
          command -v zoxide && echo "✅ zoxide OK"
          command -v atuin && echo "✅ atuin OK"

          echo "--- Verifying bin scripts ---"
          ./bin/dev --help || true
          ./bin/dot || true
